<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Original public pursuit corridor</title></head>
<body data-smoke-status="pending"><iframe id="game" src="../index.html" title="B/X RPG"></iframe><pre id="result">Waiting...</pre><script type="module">
import {createDemoState} from '../src/state/state.js';
import {SAVE_KEY} from '../src/state/storage.js';
const frame=document.getElementById('game');
const end=(s,m)=>{document.body.dataset.smokeStatus=s;document.getElementById('result').textContent=m;};
let started=false;const timer=setInterval(()=>{
 const doc=frame.contentDocument;
 if(started||doc.getElementById('app')?.dataset.bootStatus!=='ready')return;
 started=true;clearInterval(timer);
 try {
  const ok=(b,m)=>{if(!b)throw Error(m);};
  const val=k=>doc.getElementById(k).textContent;
  const send=cmd=>{doc.getElementById('command').value=cmd;
    doc.getElementById('command-form').dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}));};
  frame.contentWindow.localStorage.setItem(SAVE_KEY,JSON.stringify(createDemoState(61)));
  doc.getElementById('load').click();
  send('establish public demo pursuit corridor');
  ok(val('revision')==='0','early route assertion mutated state');
  for(const k of ['we rest for one turn','we rest for one turn','establish pending encounter',
    'adjudicate surprise','assess encounter visibility','handoff encounter',
    'record public demo pursuit choice','review public demo pursuit rates',
    'establish public demo party load','review public demo pursuit round budget'])send(k);
  ok(val('encounter')==='Running budget reviewed · route and rounds unresolved',
    'rate prerequisite not recorded');
  send('establish public demo pursuit corridor');
  ok(val('encounter')==='Public corridor verified · pursuit rounds unresolved',
    'corridor validation missing');
  ok(val('revision')==='11'&&val('turns')==='2'&&val('draws')==='5',
    'route witness mutated clock or RNG');
  ok(val('light').includes('4 turns remaining'),'route witness consumed torch');
  const narrative=doc.getElementById('log').firstElementChild.textContent;
  ok(narrative.includes('independently authored straight corridor')&&
    narrative.includes('not established')&&narrative.includes('No running round'),
    'no-movement or sight warnings missing');
  ok(!narrative.includes('goblin')&&!narrative.includes('60 feet')&&
    !narrative.includes('20 feet'),'private distance/rate leaked');
  doc.getElementById('save').click();
  const saved=JSON.parse(frame.contentWindow.localStorage.getItem(SAVE_KEY));
  ok(saved.schemaVersion===15&&saved.activeEncounter.stage==='awaiting-first-pursuit-round-evidence',
    'v13 route stage missing');
  ok(saved.journal.at(-1).kind==='encounter.pursuit-route-established' &&
    !('distanceFeet' in saved.journal.at(-1)),'route record leaked private encounter distance');
  doc.getElementById('reset').click();doc.getElementById('load').click();
  ok(val('encounter')==='Public corridor verified · pursuit rounds unresolved','saved route lost');
  for(const k of ['establish public demo pursuit corridor','review public demo pursuit round budget',
    'we rest for one turn','roll d6','resolve public demo nonpursuit','chase them'])send(k);
  ok(val('revision')==='11'&&val('turns')==='2'&&val('draws')==='5',
    'unsupported chase mutated saved route');
  end('passed','Original public corridor, no moved rounds and v13 save passed.');
 }catch(e){end('failed',String(e.stack||e));}
},25);
setTimeout(()=>{if(!started){clearInterval(timer);end('failed','Game never booted');}},5000);
</script></body></html>
